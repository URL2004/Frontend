<div id="loginScreen" class="screen">
 <div class="qd-orb o1"></div>
 <div class="qd-orb o2"></div>
 <div class="qd-ring" aria-hidden="true">
  <svg viewBox="0 0 620 620" fill="none" xmlns="http://www.w3.org/2000/svg">
   <defs>
    <linearGradient id="qdRingG" x1="0" y1="0" x2="1" y2="1">
     <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".0"/>
     <stop offset="45%" stop-color="#3b82f6" stop-opacity=".9"/>
     <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="qdRingG2" x1="1" y1="0" x2="0" y2="1">
     <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
     <stop offset="55%" stop-color="#60a5fa" stop-opacity=".7"/>
     <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
   </defs>
   <circle cx="310" cy="310" r="280" stroke="url(#qdRingG)" stroke-width="1.5" stroke-dasharray="6 10"/>
   <circle cx="310" cy="310" r="220" stroke="url(#qdRingG2)" stroke-width="1" stroke-dasharray="2 14"/>
   <circle cx="310" cy="310" r="160" stroke="url(#qdRingG)" stroke-width=".75" stroke-dasharray="1 6"/>
  </svg>
 </div>
 <div class="lcard">
 <div class="llogo"><img src="/assets/img/brand-logo.webp" alt="교수님 피하기"></div>
 <div class="ltitle">AI 초안, 내 글의 흐름에 맞게</div>
 <div class="ldesc">AI식 문체 신호를 확인하고 원문의 뜻과 장르를 지키며 다듬어요.<br>과제·자소서·논문을 한곳에서 관리할 수 있어요.</div>
 <button id="googleLoginBtn" class="btn-google" type="button" onclick="googleLogin()">
 <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
 Google로 시작하기
</button>
 <button id="kakaoLoginBtn" class="btn-kakao" type="button" onclick="kakaoLogin()" aria-describedby="socialLoginStatus">
 <img src="https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_medium.png" alt="kakao" style="width:20px;height:20px;">
 카카오로 시작하기
</button>
 <div id="socialLoginStatus" class="social-login-status" role="status" aria-live="polite" hidden>
  <span class="social-login-spinner" aria-hidden="true"></span>
  <span id="socialLoginStatusText">로그인을 확인하고 있어요.</span>
 </div>
 <div class="lbadge">신규 가입 시 10크레딧 · AI 감지 1,000자 또는 기본 휴머나이징 500자</div>
 <button class="lhome" onclick="gpLandingBackHome()">홈으로 돌아가기</button>
 <div class="kakao-warn">
 <p>카카오톡 안에서는 Google 로그인을 사용할 수 없어요</p>
 <span>Chrome 브라우저로 열어 계속해 주세요.</span>
 <button onclick="openExternal()" style="padding:10px 20px;border-radius:50px;border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:600;cursor:pointer;">Chrome으로 열기</button>
</div>
</div>
</div>

<div id="authTransition" class="gp-auth-transition" aria-hidden="true" hidden>
 <div class="gp-auth-transition-panel" role="status" aria-live="assertive" aria-atomic="true">
  <img src="/assets/img/brand-logo.webp" alt="" aria-hidden="true">
  <span class="gp-auth-transition-spinner" aria-hidden="true"></span>
  <h2 id="authTransitionTitle">카카오 로그인 확인 중</h2>
  <p id="authTransitionMessage">작업 화면을 준비하고 있어요.</p>
 </div>
</div>
