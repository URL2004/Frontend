<div id="adminHumanizeLabContent" class="gp-admin-page gp-admin-lab-page" style="display:none;">
  <div class="gp-admin-shell">
    <header class="gp-admin-head">
      <div class="gp-admin-head-title">
        <div class="gp-admin-kicker">Admin Lab</div>
        <h2>휴머나이징 보존형 테스트</h2>
      </div>
      <div class="gp-admin-lab-head-actions">
        <button type="button" class="gp-admin-refresh" onclick="openAdminPage()">관리자 페이지</button>
        <button type="button" id="adminLabHeaderRunBtn" class="gp-admin-primary" onclick="adminHumanizeLabRun()">테스트 실행</button>
      </div>
    </header>

    <div id="adminLabGateMsg" class="gp-admin-gate" hidden></div>

    <section class="gp-admin-panel">
      <div class="gp-admin-section-head">
        <h3>테스트 입력</h3>
        <p>운영 기능에는 적용하지 않고, 이 페이지에서만 preserve-lab 프로필로 실행합니다.</p>
      </div>
      <div class="gp-admin-lab-toolbar">
        <label class="gp-admin-label">
          <span>테스트 모드</span>
          <select id="adminLabMode" class="gp-admin-input gp-admin-select">
            <option value="blog">기본 피하기</option>
            <option value="polish">과제 어투로 다듬기</option>
            <option value="formal">고급 피하기</option>
          </select>
        </label>
        <label class="gp-admin-label">
          <span>언어</span>
          <select id="adminLabLang" class="gp-admin-input gp-admin-select">
            <option value="ko" selected>한국어</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="gp-admin-label gp-admin-lab-memo">
          <span>메모</span>
          <input id="adminLabMemo" class="gp-admin-input" type="text" maxlength="2000" placeholder="선택 사항: 실제 근거나 유지할 말투">
        </label>
      </div>
      <label class="gp-admin-label gp-admin-lab-text">
        <span>원문 <em id="adminLabInputCount">0자</em></span>
        <textarea id="adminLabInput" class="gp-admin-input" rows="12" placeholder="테스트할 원문을 붙여넣으세요." oninput="adminHumanizeLabCount()"></textarea>
      </label>
      <div class="gp-admin-lab-actions">
        <button type="button" id="adminLabRunBtn" class="gp-admin-primary" onclick="adminHumanizeLabRun()">보존형 테스트 실행</button>
        <button type="button" class="gp-admin-refresh" onclick="adminHumanizeLabClear()">초기화</button>
        <span id="adminLabStatus" class="gp-admin-msg"></span>
      </div>
    </section>

    <section class="gp-admin-panel">
      <div class="gp-admin-section-head">
        <h3>테스트 결과 <span id="adminLabJobId" class="gp-admin-count"></span></h3>
        <p>저위험 라우터, 프록시 게이트, 표면 게이트가 적용된 테스트 결과입니다.</p>
      </div>
      <div class="gp-admin-lab-result-grid">
        <label class="gp-admin-label gp-admin-lab-output">
          <span>결과문</span>
          <textarea id="adminLabOutput" class="gp-admin-input" rows="16" readonly></textarea>
        </label>
        <div class="gp-admin-lab-meta">
          <div id="adminLabMetaChips" class="gp-admin-lab-chips"></div>
          <pre id="adminLabMetaJson" class="gp-admin-lab-json">{}</pre>
        </div>
      </div>
      <div class="gp-admin-lab-actions">
        <button type="button" class="gp-admin-refresh" onclick="adminHumanizeLabCopy()">결과 복사</button>
      </div>
    </section>
  </div>
</div>
